<script>
(function () {
'use strict';

/* =====================================================================================================
 * 1. UTILITIES
 * ===================================================================================================== */
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
/** HTML-escape any value for text or attribute positions. */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC_MAP[c]);
/** Always an array (templates iterate with list(x).map(...)). */
const list = (a) => (Array.isArray(a) ? a : []);
const clone = (o) => JSON.parse(JSON.stringify(o));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const pad2 = (n) => String(n).padStart(2, '0');

/** localStorage is per-viewer and can be blocked — always optional. */
function store(key, value) {
  try {
    if (value === undefined) return window.localStorage.getItem(key);
    window.localStorage.setItem(key, value);
  } catch (e) { /* storage unavailable: ignore */ }
  return null;
}

/* =====================================================================================================
 * 2. CONSTANTS
 * ===================================================================================================== */
/**
 * The design is a fixed 1180×820 "tablet" workspace centred on a desk-coloured page and scaled to fit the window.
 *   fit: true  → exactly as in index.html
 *   fit: false → the workspace fills the whole browser window (full-bleed)
 */
const WORKSPACE = { width: 1180, height: 820, fit: true, deskShade: '#f0f0f0' };
const TOAST_MS = 2200;
const AUTO_REFRESH_MS = 60000;

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const STATUS_DOTS = {
  'Planned': 'var(--chart-1)', 'In Progress': 'var(--chart-2)', 'Completed': 'var(--chart-5)',
  'On Hold': 'var(--muted-foreground)', 'Cancelled': 'var(--neutral-600)', 'Not Applicable': 'var(--neutral-300)'
};
const statusDot = (st) => STATUS_DOTS[st] || 'var(--muted-foreground)';

/** Fallback dropdown values; the live values come from the Config sheet via getInitialData(). */
const DEFAULT_CFG = {
  status: ['Planned', 'In Progress', 'Completed', 'On Hold', 'Cancelled', 'Not Applicable'],
  region: ['NA', 'LATAM', 'EMEA', 'APAC', 'US'],
  assessment_type: ['Questionnaire', 'Document Review', 'On-Site Audit', 'Continuous Monitoring'],
  framework: ['SOX', 'HIPAA', 'PCI DSS', 'GDPR', 'DORA', 'ISO 27001', 'SIG', 'VSAQ', 'SOC 2', 'NIST CSF'],
  role: ['Manager', 'Reviewer'],
  supplier_type: ['Tier 1', 'TPD', 'SaaS', 'Logistics', 'Tier 2', 'Review', 'Tier 1 OR', 'VIS', 'TF Project', 'Frontier'],
  infosec_version: ['4.1', '4.2']
};

const VIEW_TITLES = {
  exec: ['Executive Summary', 'read-only · driven entirely by the data layer'],
  analytics: ['Analytics', 'workload metrics exclude Not Applicable; universe counts include it'],
  program: ['Program View', '12-month planning surface for leadership'],
  roster: ['Roster', ''], // subtitle = the live SPREADSHEET_ID (see renderVals)
  users: ['User Management', 'manager-only · add users by email and assign roles'],
};
const MANAGER_ONLY_VIEWS = ['users'];

/* =====================================================================================================
 * 3. STATE  (single object; every change goes through setState() → render())
 * ===================================================================================================== */
const S = {
  boot: 'loading',          // loading | ready | denied | error
  bootError: '',
  me: null,                 // { email, first, last, full, initials, role } — resolved by the server
  cfg: clone(DEFAULT_CFG),
  dark: store('tprm.dark') === '1',
  view: 'exec',
  viewAs: 'Manager',        // Managers can preview the Reviewer experience; the server still enforces the real role
  year: new Date().getFullYear(),
  scale: 1,

  tps: [], lobs: [], users: [], tpsStamp: 0, loadedAt: 0,

  panelOpen: false, draft: null, draftErr: '', deleteArmed: false, busy: false,
  userErr: '', userPanelOpen: false, userDraft: null, userDraftErr: '',
  newUserEmail: '', newUserFirst: '', newUserLast: '', newUserRole: 'Reviewer',
  filters: { q: '', status: 'All statuses', region: 'All regions', owner: 'All owners', fw: 'All frameworks' },
  sort: { key: 'month', dir: 1 },
  savedMsg: ''
};

function setState(patch) {
  Object.assign(S, patch);
  render();
}

/* =====================================================================================================
 * 4. SERVER BRIDGE — google.script.run, promisified. Never rejects: always resolves {success,...}.
 * ===================================================================================================== */
function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolve) => {
    try {
      const runner = window.google.script.run
        .withSuccessHandler((res) => resolve(res && typeof res === 'object' ? res : { success: false, error: 'Empty response from server.' }))
        .withFailureHandler((err) => resolve({ success: false, error: (err && err.message) || String(err) }));
      runner[fn].apply(runner, args);
    } catch (e) {
      resolve({ success: false, error: (e && e.message) || String(e) });
    }
  });
}

/* =====================================================================================================
 * 5. RENDERER — string templates → DOM patch ("morph"), so focus, caret, scroll positions, hover state and
 *    CSS entrance animations survive every state change (a plain innerHTML swap would reset all of them).
 * ===================================================================================================== */
let appEl = null;

function render() {
  if (!appEl) return;
  const html = S.boot === 'ready' ? buildApp(renderVals()) : buildBootState();
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  morphChildren(appEl, tpl.content);
  // freshly inserted <select>s have no morph pass: apply their data-value once everything is in the DOM
  Array.prototype.forEach.call(appEl.querySelectorAll('select[data-value]'), (sel) => {
    const v = sel.getAttribute('data-value');
    if (sel.value !== v && Array.prototype.some.call(sel.options, (o) => o.value === v)) sel.value = v;
  });
}

function morphChildren(from, to) {
  const next = Array.prototype.slice.call(to.childNodes);
  for (let i = 0; i < next.length; i++) {
    const a = from.childNodes[i];
    if (!a) from.appendChild(next[i]);
    else morphNode(a, next[i]);
  }
  while (from.childNodes.length > next.length) from.removeChild(from.lastChild);
}

function morphNode(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.parentNode.replaceChild(b, a); return; }
  if (a.nodeType === 3 || a.nodeType === 8) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  if (a.nodeType !== 1) return;
  patchAttrs(a, b);
  if (a.nodeName === 'TEXTAREA') { if (a.value !== b.value) a.value = b.value; return; }
  morphChildren(a, b);
  if (a.nodeName === 'INPUT') syncInput(a, b);
  else if (a.nodeName === 'SELECT') syncSelect(a, b);
}

function patchAttrs(a, b) {
  a.getAttributeNames().forEach((n) => { if (!b.hasAttribute(n)) a.removeAttribute(n); });
  b.getAttributeNames().forEach((n) => {
    const v = b.getAttribute(n);
    if (a.getAttribute(n) !== v) a.setAttribute(n, v);
  });
}

function syncInput(a, b) {
  // Never fight the user while they type in a field the browser validates (number / month).
  if (a === document.activeElement && (a.type === 'number' || a.type === 'month' || a.type === 'date')) return;
  const v = b.getAttribute('value') || '';
  if (a.value !== v) a.value = v;
}

function syncSelect(a, b) {
  const v = b.getAttribute('data-value');
  if (v == null) return;
  const hasOption = Array.prototype.some.call(a.options, (o) => o.value === v);
  if (hasOption && a.value !== v) a.value = v;
}

/* ---- event delegation: markup carries data-act / data-chg ---- */
const H = {}; // handler registry — see section 10
function bindEvents(root) {
  const dispatch = (attr) => (e) => {
    const el = e.target.closest && e.target.closest('[' + attr + ']');
    if (!el || !root.contains(el)) return;
    const fn = H[el.getAttribute(attr)];
    if (fn) fn(el, e);
  };
  root.addEventListener('click', dispatch('data-act'));
  root.addEventListener('input', (e) => { if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.nodeName)) dispatch('data-chg')(e); });
}

let toastTimer = null;
function flash(msg, ms) {
  if (toastTimer) clearTimeout(toastTimer);
  setState({ savedMsg: msg });
  toastTimer = setTimeout(() => setState({ savedMsg: '' }), ms || TOAST_MS);
}

function updateScale() {
  if (!WORKSPACE.fit) { S.scale = 1; return; }
  S.scale = Math.max(Math.min((window.innerWidth - 16) / WORKSPACE.width, (window.innerHeight - 16) / WORKSPACE.height), 0.2);
}


/* =====================================================================================================
 * 6. DOMAIN HELPERS
 * ===================================================================================================== */
const splitList = (s) => String(s || '').split(',').map((x) => x.trim()).filter(Boolean);
const fwArr = (tp) => splitList(tp.applicable_frameworks);
const regArr = (tp) => splitList(tp.regions);
const myYear = (tp) => (tp.assessment_month_year ? parseInt(tp.assessment_month_year.slice(0, 4), 10) : null);
const myMonth = (tp) => (tp.assessment_month_year ? parseInt(tp.assessment_month_year.slice(5, 7), 10) - 1 : null);
function monthLabel(my) {
  if (!my) return '—';
  return MONTHS[parseInt(my.slice(5, 7), 10) - 1].slice(0, 3) + ' ' + my.slice(0, 4);
}
const sortArrow = (k) => (S.sort.key === k ? (S.sort.dir === 1 ? '↑' : '↓') : '');
const effectiveRole = () => (S.me && S.me.role === 'Manager' ? S.viewAs : 'Reviewer');
const viewAllowed = (view) => !(MANAGER_ONLY_VIEWS.indexOf(view) >= 0 && effectiveRole() !== 'Manager');
const emailRe = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
function userParts(u) {
  const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : '');
  const local = String(u.email || '').split('@')[0];
  const first = (u.first || '').trim() || cap(local.split('.')[0] || '');
  const last = (u.last || '').trim() || cap(local.split('.')[1] || '');
  return { first, last, full: (first + ' ' + last).trim(), initials: ((first[0] || '') + (last[0] || '')).toUpperCase() };
}
function newDraft() {
  return {
    tp_id: '', name: '', alternate_name: '', assessment_month_year: S.year + '-01', status: 'Planned', lead_reviewer: '',
    regions: 'NA', tp_locations: '', headcount: '', notes: '', business_owner: '', assessment_type: S.cfg.assessment_type[0] || 'Questionnaire',
    applicable_frameworks: '', vra_number: '', completed_date: '', region_lead: '', supplier_type: '', infosec_version: '',
    created_at: '', updated_at: '', lobs: [{ lob_id: '', line_of_business: '', service_description: '', vendor_manager: '' }]
  };
}

/** Applies a getInitialData() payload to state (used at boot and on background refresh). */
function applyAppData(d) {
  S.me = d.me;
  S.cfg = Object.assign(clone(DEFAULT_CFG), d.config || {});
  S.tps = list(d.tps);
  S.lobs = list(d.lobs);
  S.users = list(d.users);
  S.tpsStamp++;
  S.spreadsheetId = String(d.spreadsheetId || '');
  S.loadedAt = Date.now();
  S.viewAs = d.me.role === 'Manager' ? S.viewAs : 'Reviewer';
  if (!viewAllowed(S.view)) S.view = 'exec';
}


/* =====================================================================================================
 * 7. DERIVED VALUES — everything the views display is computed here from state.
 *    (Executive Summary / Analytics / Program View / Roster are driven only by the data layer.)
 * ===================================================================================================== */
function renderVals() {
  const Y = S.year;
  const role = effectiveRole();
  const isMgr = role === 'Manager';
  const statusOrder = S.cfg.status;
  const regions = S.cfg.region;

  const inYear = S.tps.filter((t) => myYear(t) === Y);
  const work = inYear.filter((t) => t.status !== 'Not Applicable');           // workload metrics exclude Not Applicable
  const completed = work.filter((t) => t.status === 'Completed');
  const naAll = S.tps.filter((t) => t.status === 'Not Applicable');           // universe counts include it
  const rate = work.length ? Math.round((completed.length / work.length) * 100) : 0;
  const gaps = S.tps.filter((t) => t.status !== 'Not Applicable' && myYear(t) !== Y);

  // ---- Executive Summary
  const fwCounts = {};
  S.tps.forEach((t) => fwArr(t).forEach((f) => { fwCounts[f] = (fwCounts[f] || 0) + 1; }));
  const fwMax = Math.max(1, ...Object.keys(fwCounts).map((k) => fwCounts[k]));
  const fwCoverage = Object.keys(fwCounts).sort((a, b) => fwCounts[b] - fwCounts[a])
    .map((n) => ({ name: n, count: fwCounts[n], w: Math.round((fwCounts[n] / fwMax) * 100) + '%' }));

  const donutLegend = statusOrder
    .map((st) => ({ label: st, count: S.tps.filter((t) => t.status === st).length, color: statusDot(st) }))
    .filter((s) => s.count > 0);
  let acc = 0;
  const total = Math.max(1, S.tps.length);
  const stops = donutLegend.map((s) => {
    const from = (acc / total) * 360; acc += s.count;
    return s.color + ' ' + from.toFixed(1) + 'deg ' + ((acc / total) * 360).toFixed(1) + 'deg';
  });
  const donutBg = stops.length ? 'conic-gradient(' + stops.join(', ') + ')' : 'var(--muted)';
  const naSorted = naAll.slice().sort((a, b) => (b.assessment_month_year || '').localeCompare(a.assessment_month_year || '')).slice(0, 4);

  // ---- Analytics
  const rMax = Math.max(1, ...regions.map((r) => work.filter((t) => regArr(t).indexOf(r) >= 0).length));
  const regionBars = regions.map((r) => {
    const rows = work.filter((t) => regArr(t).indexOf(r) >= 0);
    return { region: r, count: rows.length, heads: rows.reduce((s, t) => s + (+t.headcount || 0), 0).toLocaleString(), w: Math.round((rows.length / rMax) * 100) + '%' };
  });
  const qData = [0, 1, 2, 3].map((q) => {
    const rows = work.filter((t) => myMonth(t) !== null && Math.floor(myMonth(t) / 3) === q);
    const comp = rows.filter((t) => t.status === 'Completed');
    return { label: 'Q' + (q + 1), s: rows.length, c: comp.length, rate: rows.length ? Math.round((comp.length / rows.length) * 100) + '% done' : '—' };
  });
  const qMax = Math.max(1, ...qData.map((q) => q.s));
  const quarterBars = qData.map((q) => Object.assign(q, { sH: Math.max(3, Math.round((q.s / qMax) * 100)) + '%', cH: Math.max(3, Math.round((q.c / qMax) * 100)) + '%' }));
  const mData = MONTHS.map((mm, i) => {
    const rows = work.filter((t) => myMonth(t) === i);
    return { label: mm[0], s: rows.length, c: rows.filter((t) => t.status === 'Completed').length };
  });
  const mMax = Math.max(1, ...mData.map((m) => m.s));
  const monthBars = mData.map((m) => Object.assign(m, { sH: Math.max(3, Math.round((m.s / mMax) * 100)) + '%', cH: Math.max(3, Math.round((m.c / mMax) * 100)) + '%' }));

  // ---- Program View
  const monthCells = MONTHS.map((mm, i) => {
    const rows = inYear.filter((t) => myMonth(t) === i)
      .sort((a, b) => (a.status === 'Not Applicable') - (b.status === 'Not Applicable') || a.name.localeCompare(b.name));
    const active = rows.filter((t) => t.status !== 'Not Applicable');                // muted N/A rows do not count
    return {
      label: mm, count: active.length,
      items: rows.map((t) => ({ tp_id: t.tp_id, name: t.name, status: t.status, dot: statusDot(t.status), op: t.status === 'Not Applicable' ? 0.45 : 1 }))
    };
  });

  // ---- Roster
  const F = S.filters;
  const q = F.q.trim().toLowerCase();
  const rosterRows = S.tps.filter((t) => {
    if (q && [t.name, t.alternate_name, t.tp_id, t.vra_number, t.lead_reviewer, t.region_lead, t.business_owner].join(' ').toLowerCase().indexOf(q) < 0) return false;
    if (F.status !== 'All statuses' && t.status !== F.status) return false;
    if (F.region !== 'All regions' && regArr(t).indexOf(F.region) < 0) return false;
    if (F.owner !== 'All owners' && t.business_owner !== F.owner) return false;
    if (F.fw !== 'All frameworks' && fwArr(t).indexOf(F.fw) < 0) return false;
    return true;
  }).sort((a, b) => {
    const k = S.sort.key;
    const sv = (t) => k === 'name' ? t.name.toLowerCase()
      : k === 'month' ? (t.assessment_month_year || '9999')
      : k === 'status' ? t.status
      : k === 'vra' ? (t.vra_number || '\uffff')
      : k === 'completed' ? (t.completed_date || '9999')
      : k === 'region' ? regArr(t).join(', ')
      : k === 'regionLead' ? (t.region_lead || '\uffff')
      : k === 'lead' ? t.lead_reviewer
      : k === 'owner' ? t.business_owner
      : k === 'supplier' ? (t.supplier_type || '\uffff')
      : k === 'type' ? t.assessment_type
      : k === 'infosec' ? (t.infosec_version || '\uffff')
      : fwArr(t).join(', ');
    return (String(sv(a)).localeCompare(String(sv(b))) || a.name.localeCompare(b.name)) * S.sort.dir;
  }).map((t) => {
    const fw = fwArr(t);
    return {
      tp_id: t.tp_id, name: t.name, monthLabel: monthLabel(t.assessment_month_year), status: t.status, dot: statusDot(t.status),
      regions: regArr(t), lead: t.lead_reviewer, owner: t.business_owner, type: t.assessment_type,
      vra: t.vra_number || '—', completed: t.completed_date || '—', regionLead: t.region_lead || '—',
      supplier: t.supplier_type || '—', infosec: t.infosec_version || '—',
      fwText: fw.slice(0, 2).join(' · ') + (fw.length > 2 ? ' +' + (fw.length - 2) : ''), op: t.status === 'Not Applicable' ? 0.55 : 1
    };
  });
  const extraFw = Object.keys(fwCounts).filter((f) => S.cfg.framework.indexOf(f) < 0).sort();

  // ---- Record panel
  const dr = S.draft || {};
  const drFw = S.draft ? fwArr(dr) : [];
  const chip = (name, on) => ({ name, on, bg: on ? 'var(--primary)' : 'transparent', fg: on ? 'var(--primary-foreground)' : 'var(--foreground)', bc: on ? 'var(--primary)' : 'var(--border)' });
  const fwChipNames = S.cfg.framework.concat(drFw.filter((f) => S.cfg.framework.indexOf(f) < 0)); // keep unknown tags removable

  // ---- Users
  const users = S.users.map((u) => {
    const n = userParts(u);
    return { email: u.email, name: n.full, role: u.role, added: u.added, badge: u.role === 'Manager' ? 'default' : 'secondary', initials: n.initials };
  });
  const ud = S.userDraft;
  const me = S.me || { full: '', initials: '' };

  // ---- workspace frame
  const fit = WORKSPACE.fit;
  const wsDyn = fit
    ? 'left:50%;top:50%;width:' + WORKSPACE.width + 'px;height:' + WORKSPACE.height + 'px;transform:translate(-50%,-50%) scale(' + S.scale + ')'
    : 'left:0;top:0;width:100%;height:100%;transform:none;border:0;border-radius:0;box-shadow:none';

  const navBg = (v) => (S.view === v ? 'var(--sidebar-accent)' : 'transparent');
  const navFg = (v) => (S.view === v ? 'var(--sidebar-accent-foreground)' : 'var(--muted-foreground)');
  const yearOptions = [new Date().getFullYear() - 1, new Date().getFullYear(), new Date().getFullYear() + 1];
  if (yearOptions.indexOf(Y) < 0) yearOptions.push(Y);

  return {
    // shell
    themeClass: S.dark ? 'dark' : '',
    deskBg: S.dark ? 'oklch(0.11 0 0)' : WORKSPACE.deskShade,
    wsDyn, year: Y, yearOptions, role, isManager: isMgr,
    sunDisp: S.dark ? 'block' : 'none', moonDisp: S.dark ? 'none' : 'block',
    themeTitle: S.dark ? 'Switch to light mode' : 'Switch to dark mode',
    userName: me.full, userInitials: me.initials,
    roleMgrState: isMgr ? 'active' : 'inactive', roleRevState: isMgr ? 'inactive' : 'active',
    viewTitle: VIEW_TITLES[S.view][0],
    viewSub: S.view === 'roster' ? (S.spreadsheetId || '—') : VIEW_TITLES[S.view][1],
    viewSubIsId: S.view === 'roster',
    isExec: S.view === 'exec', isAnalytics: S.view === 'analytics', isProgram: S.view === 'program',
    isRoster: S.view === 'roster', isUsers: S.view === 'users',
    navExecBg: navBg('exec'), navExecFg: navFg('exec'), navAnalyticsBg: navBg('analytics'), navAnalyticsFg: navFg('analytics'),
    navProgramBg: navBg('program'), navProgramFg: navFg('program'), navRosterBg: navBg('roster'), navRosterFg: navFg('roster'),
    navUsersBg: navBg('users'), navUsersFg: navFg('users'),

    // option lists (from the Config sheet)
    statusOptions: statusOrder, regionOptions: regions, typeOptions: S.cfg.assessment_type, roleOptions: S.cfg.role,
    supplierOptions: list(S.cfg.supplier_type), infosecOptions: list(S.cfg.infosec_version),

    // executive summary
    kUniverse: S.tps.length, kScheduled: work.length, kCompleted: completed.length, kRatePct: rate + '%', kNa: naAll.length,
    fwCoverage, donutBg, donutLegend,
    gapItems: gaps.map((t) => ({ tp_id: t.tp_id, name: t.name, owner: t.business_owner })), hasGaps: gaps.length > 0, noGaps: gaps.length === 0,
    naRecent: naSorted.map((t) => ({ tp_id: t.tp_id, name: t.name, note: t.notes, monthLabel: monthLabel(t.assessment_month_year) })),

    // analytics / program
    regionBars, quarterBars, monthBars, monthCells,

    // roster
    filters: S.filters, rosterRows,
    statusLegend: statusOrder.map((st) => ({ label: st, color: statusDot(st) })),
    arrName: sortArrow('name'), arrMonth: sortArrow('month'), arrStatus: sortArrow('status'), arrRegion: sortArrow('region'),
    arrLead: sortArrow('lead'), arrOwner: sortArrow('owner'), arrType: sortArrow('type'), arrFw: sortArrow('fw'),
    arrVra: sortArrow('vra'), arrCompleted: sortArrow('completed'), arrRegionLead: sortArrow('regionLead'),
    arrSupplier: sortArrow('supplier'), arrInfosec: sortArrow('infosec'),
    rosterCount: rosterRows.length + ' of ' + S.tps.length + ' third parties',
    ownerOptions: Array.from(new Set(S.tps.map((t) => t.business_owner).filter(Boolean))).sort(),
    fwNames: S.cfg.framework.concat(extraFw),

    // users
    users, newUserEmail: S.newUserEmail, newUserFirst: S.newUserFirst, newUserLast: S.newUserLast, newUserRole: S.newUserRole, userErr: S.userErr,
    userPanelOpen: S.userPanelOpen, userDraft: ud || {}, userDraftErr: S.userDraftErr, userDraftAdded: (ud || {}).added || '',
    userDraftInitials: ud ? userParts(ud).initials : '',

    // record panel
    panelOpen: S.panelOpen, draft: dr, busy: S.busy,
    panelTitle: dr.name || 'New third party',
    panelId: dr.tp_id || 'ID assigned on save',
    panelMeta: dr.created_at ? '· created ' + dr.created_at.slice(0, 10) + ' · updated ' + (dr.updated_at || '').slice(0, 10) : '',
    draftIsNA: S.panelOpen && dr.status === 'Not Applicable', draftNotNA: S.panelOpen && dr.status !== 'Not Applicable',
    draftErr: S.draftErr, lobRows: dr.lobs || [],
    regionChips: regions.map((n) => chip(n, S.draft ? regArr(dr).indexOf(n) >= 0 : false)),
    regionLeadChips: regions.map((n) => chip(n, !!S.draft && dr.region_lead === n)),
    fwChips: fwChipNames.map((n) => chip(n, drFw.indexOf(n) >= 0)),
    canDelete: isMgr && !!dr.tp_id, deleteArmed: S.deleteArmed, deleteNotArmed: !S.deleteArmed,

/* =====================================================================================================
 * 10. EVENT HANDLERS — H[name](element, event). Markup binds them with data-act / data-chg.
 *     Every server call goes through api(), which resolves {success,data|error} and never throws.
 * ===================================================================================================== */
const resetScroll = () => { const m = document.getElementById('main-scroll'); if (m) m.scrollTop = 0; };
const isManagerNow = () => !!S.me && S.me.role === 'Manager';

/* ---- shell ------------------------------------------------------------------------------------------ */
H.setView = (el) => {
  const view = el.getAttribute('data-view');
  if (!VIEW_TITLES[view] || !viewAllowed(view)) return;
  setState({ view });
  resetScroll();
};
H.setRole = (el) => {
  if (!isManagerNow()) return; // only a real Manager may preview the Reviewer experience; the server still enforces the real role
  const viewAs = el.getAttribute('data-role') === 'Reviewer' ? 'Reviewer' : 'Manager';
  const patch = { viewAs };
  if (viewAs !== 'Manager') { patch.userPanelOpen = false; patch.userDraft = null; }
  Object.assign(S, patch);
  if (!viewAllowed(S.view)) S.view = 'exec';
  render();
};
H.toggleDark = () => { store('tprm.dark', S.dark ? '0' : '1'); setState({ dark: !S.dark }); };
H.setYear = (el) => setState({ year: parseInt(el.value, 10) || S.year });
H.retryBoot = () => boot();

/* ---- roster filters / sorting ----------------------------------------------------------------------- */
H.onFilter = (el) => {
  const key = el.getAttribute('data-key');
  if (!(key in S.filters)) return;
  S.filters = Object.assign({}, S.filters, { [key]: el.value });
  render();
};
H.clearFilters = () => setState({ filters: { q: '', status: 'All statuses', region: 'All regions', owner: 'All owners', fw: 'All frameworks' } });
H.sortBy = (el) => {
  const key = el.getAttribute('data-key');
  setState({ sort: { key, dir: S.sort.key === key ? -S.sort.dir : 1 } });
};

/* ---- third-party record panel ----------------------------------------------------------------------- */
const blankLob = () => ({ lob_id: '', line_of_business: '', service_description: '', vendor_manager: '' });
function closeRecordPanel() { setState({ panelOpen: false, draft: null, draftErr: '', deleteArmed: false, busy: false }); }

H.openTp = (el) => {
  const id = el.getAttribute('data-id');
  const tp = S.tps.filter((t) => t.tp_id === id)[0];
  if (!tp) return;
  const lobs = S.lobs.filter((l) => l.tp_id === id).map(clone);
  setState({ panelOpen: true, draft: Object.assign(clone(tp), { lobs: lobs.length ? lobs : [blankLob()] }), draftErr: '', deleteArmed: false });
};
H.newTp = () => setState({ panelOpen: true, draft: newDraft(), draftErr: '', deleteArmed: false });
H.closePanel = () => { if (!S.busy) closeRecordPanel(); };
H.onDraft = (el) => {
  if (!S.draft) return;
  S.draft[el.getAttribute('data-field')] = el.value;
  S.draftErr = '';
  render();
};
function toggleInList(current, value, order) {
  const set = splitList(current);
  const at = set.indexOf(value);
  if (at >= 0) set.splice(at, 1); else set.push(value);
  const rank = (x) => { const i = order.indexOf(x); return i < 0 ? 999 : i; };
  return set.sort((a, b) => rank(a) - rank(b)).join(', ');
}
H.pickRegionLead = (el) => {
  if (!S.draft) return;
  const r = el.getAttribute('data-region');
  S.draft.region_lead = S.draft.region_lead === r ? '' : r; // click again to clear
  S.draftErr = '';
  render();
};
H.toggleRegion = (el) => {
  if (!S.draft) return;
  S.draft.regions = toggleInList(S.draft.regions, el.getAttribute('data-region'), S.cfg.region);
  S.draftErr = '';
  render();
};
H.toggleFw = (el) => {
  if (!S.draft) return;
  S.draft.applicable_frameworks = toggleInList(S.draft.applicable_frameworks, el.getAttribute('data-fw'), S.cfg.framework);
  S.draftErr = '';
  render();
};
H.onLob = (el) => {
  if (!S.draft) return;
  const l = S.draft.lobs[parseInt(el.getAttribute('data-idx'), 10)];
  if (l) l[el.getAttribute('data-field')] = el.value;
  render();
};
H.addLob = () => { if (S.draft) { S.draft.lobs.push(blankLob()); render(); } };
H.rmLob = (el) => {
  if (!S.draft) return;
  S.draft.lobs.splice(parseInt(el.getAttribute('data-idx'), 10), 1);
  render();
};

H.saveDraft = async () => {
  const d = S.draft;
  if (!d || S.busy) return;
  if (!String(d.name || '').trim()) return setState({ draftErr: 'Name is required.' });
  if (d.assessment_month_year && !/^\d{4}-(0[1-9]|1[0-2])$/.test(d.assessment_month_year)) return setState({ draftErr: 'Assessment month must look like YYYY-MM.' });
  if (d.completed_date && !/^\d{4}-\d{2}-\d{2}$/.test(d.completed_date)) return setState({ draftErr: 'Completed date must look like YYYY-MM-DD.' });
  setState({ busy: true, draftErr: '' });
  const tp = clone(d);
  const lobs = list(tp.lobs);
  delete tp.lobs;
  const res = await api('saveThirdPartyWithLobs', tp, lobs);
  if (!res.success) return setState({ busy: false, draftErr: res.error });
  const saved = res.data.tp;
  const exists = S.tps.some((t) => t.tp_id === saved.tp_id);
  S.tps = exists ? S.tps.map((t) => (t.tp_id === saved.tp_id ? saved : t)) : S.tps.concat([saved]);
  S.lobs = S.lobs.filter((l) => l.tp_id !== saved.tp_id).concat(list(res.data.lobs));
  S.tpsStamp++;
  closeRecordPanel();
  flash((exists ? 'Saved ' : 'Added ') + saved.name);
};
H.armDelete = () => { if (isManagerNow() && S.draft && S.draft.tp_id) setState({ deleteArmed: !S.deleteArmed }); };
H.doDelete = async () => {
  const d = S.draft;
  if (!d || !d.tp_id || S.busy) return;
  setState({ busy: true, draftErr: '' });
  const res = await api('deleteThirdPartyWithLobs', d.tp_id);
  if (!res.success) return setState({ busy: false, deleteArmed: false, draftErr: res.error });
  S.tps = S.tps.filter((t) => t.tp_id !== d.tp_id);
  S.lobs = S.lobs.filter((l) => l.tp_id !== d.tp_id);
  S.tpsStamp++;
  const name = d.name;
  closeRecordPanel();
  flash('Deleted ' + name);
};

/* ---- user management (Manager only — the server re-checks every call) ------------------------------- */
H.onNewUser = (el) => {
  const k = { first: 'newUserFirst', last: 'newUserLast', email: 'newUserEmail', role: 'newUserRole' }[el.getAttribute('data-key')];
  if (!k) return;
  S[k] = el.value;
  S.userErr = '';
  render();
};
const userFormError = (u) => {
  if (!String(u.first || '').trim() || !String(u.last || '').trim()) return 'First and last name are required.';
  if (!emailRe.test(String(u.email || '').trim())) return 'Enter a valid email address.';
  return '';
};
// Removing yourself ends your own access, so the app is re-booted (it will show the access screen).
const afterUserChange = (touchedEmail) => {
  if (S.me && touchedEmail && touchedEmail.toLowerCase() === S.me.email.toLowerCase()) boot();
};
H.addUser = async () => {
  if (S.busy) return;
  const u = { first: S.newUserFirst, last: S.newUserLast, email: S.newUserEmail, role: S.newUserRole };
  const err = userFormError(u);
  if (err) return setState({ userErr: err });
  setState({ busy: true, userErr: '' });
  const res = await api('addUser', u);
  if (!res.success) return setState({ busy: false, userErr: res.error });
  setState({ busy: false, users: res.data, newUserFirst: '', newUserLast: '', newUserEmail: '', newUserRole: 'Reviewer' });
  flash('Added ' + u.email.trim().toLowerCase());
};
H.rmUser = async (el) => {
  const email = el.getAttribute('data-email');
  if (S.busy || !email) return;
  setState({ busy: true, userErr: '' });
  const res = await api('removeUser', email);
  if (!res.success) return setState({ busy: false, userErr: res.error });
  setState({ busy: false, users: res.data });
  flash('Removed ' + email);
  afterUserChange(email);
};
H.openUser = (el) => {
  const u = S.users.filter((x) => x.email === el.getAttribute('data-email'))[0];
  if (!u) return;
  setState({ userPanelOpen: true, userDraft: Object.assign(clone(u), { origEmail: u.email }), userDraftErr: '' });
};
H.closeUserPanel = () => { if (!S.busy) setState({ userPanelOpen: false, userDraft: null, userDraftErr: '' }); };
H.onUserDraft = (el) => {
  if (!S.userDraft) return;
  S.userDraft[el.getAttribute('data-key')] = el.value;
  S.userDraftErr = '';
  render();
};
H.saveUserDraft = async () => {
  const u = S.userDraft;
  if (!u || S.busy) return;
  const err = userFormError(u);
  if (err) return setState({ userDraftErr: err });
  setState({ busy: true, userDraftErr: '' });
  const res = await api('updateUser', u.origEmail, { first: u.first, last: u.last, email: u.email, role: u.role });
  if (!res.success) return setState({ busy: false, userDraftErr: res.error });
  setState({ busy: false, users: res.data, userPanelOpen: false, userDraft: null });
  flash('Saved ' + u.email.trim().toLowerCase());
  afterUserChange(u.origEmail);
};
H.rmUserFromPanel = async () => {
  const u = S.userDraft;
  if (!u || S.busy) return;
  setState({ busy: true, userDraftErr: '' });
  const res = await api('removeUser', u.origEmail);
  if (!res.success) return setState({ busy: false, userDraftErr: res.error });
  setState({ busy: false, users: res.data, userPanelOpen: false, userDraft: null });
  flash('Removed ' + u.origEmail);
  afterUserChange(u.origEmail);
};

/* =====================================================================================================
 * 11. BOOT — one getInitialData() call resolves identity (server-side), dropdown values and data.
 * ===================================================================================================== */
async function boot() {
  setState({ boot: 'loading', bootError: '' });
  const res = await api('getInitialData');
  if (res.success) {
    applyAppData(res.data);
    S.boot = 'ready';
  } else if (res.error === 'Unauthorized') {
    S.boot = 'denied';
  } else {
    S.boot = 'error';
    S.bootError = res.error || 'Unknown error.';
  }
  render();
}

/** Background refresh so a long-open tab sees other people's edits. Never interrupts editing. */
async function refreshData() {
  const busy = S.panelOpen || S.userPanelOpen || S.busy;
  if (S.boot !== 'ready' || busy || document.hidden) return;
  const res = await api('getInitialData');
  if (!res.success) return;
  if (S.panelOpen || S.userPanelOpen || S.busy) return; // the user opened something while we were waiting
  applyAppData(res.data);
  render();
}

function init() {
  appEl = document.getElementById('app');
  if (!appEl) return;
  updateScale();
  window.addEventListener('resize', () => { updateScale(); render(); });
  bindEvents(appEl);

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || S.busy) return;
    if (S.userPanelOpen) H.closeUserPanel();
    else if (S.panelOpen) H.closePanel();
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - S.loadedAt > AUTO_REFRESH_MS) refreshData(); });
  setInterval(() => { if (Date.now() - S.loadedAt > AUTO_REFRESH_MS) refreshData(); }, AUTO_REFRESH_MS);

  render();
  boot();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

})();
</script>
